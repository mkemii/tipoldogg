<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for clean organization -->
  <defs>
    <!-- Sharp Crimson Eyes -->
    <g id="eyes">
      <polygon points="190,230 230,235 220,245 190,230" fill="#D32F2F" />
      <polygon points="310,230 270,235 280,245 310,230" fill="#D32F2F" />
    </g>
  </defs>

  <!-- ICON GROUP (Fedora Hat & Shadowed Eyes) -->
  <g transform="translate(0, -10)">
    <!-- Crown of the hat -->
    <polygon points="200,100 220,75 280,75 300,100" fill="#1C1C1C" />
    <polygon points="200,100 300,100 290,135 210,135" fill="#2D2D2D" />
    
    <!-- Red Hat Ribbon -->
    <polygon points="210,135 290,135 287,145 213,145" fill="#B71C1C" />
    
    <!-- Hat Brim -->
    <polygon points="140,145 360,145 340,165 160,165" fill="#1A1A1A" />
    
    <!-- Dark Face Shadow -->
    <polygon points="175,165 325,165 295,255 205,255" fill="#111111" />
    
    <!-- Crimson Eyes -->
    <use href="#eyes" />
  </g>

  <!-- TEXT GROUP (Moved directly under the head) -->
  <g transform="translate(0, -15)">
    <!-- TEAM text with wide tracking vibe using text-anchor and dx -->
    <text x="250" y="295" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="22" 
          font-weight="900" 
          fill="#D32F2F" 
          text-anchor="middle" 
          letter-spacing="12">TEAM</text>
          
    <!-- BRG main bold text -->
    <text x="250" y="365" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="80" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="2">BRG</text>
  </g>
</svg>